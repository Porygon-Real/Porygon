name: isolated privileged acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: isolated-acceptance
    runs-on: [self-hosted, linux, porygon-disposable]
    steps:
      - uses: actions/checkout@v4
      - name: Execute only a manually approved trusted revision
        run: |
          test "${{ github.event_name }}" = workflow_dispatch
          test "${{ github.ref }}" = refs/heads/main
          test -f /etc/porygon-disposable-runner
          PAGER=cat bash scripts/verify_all.sh
