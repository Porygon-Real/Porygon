server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 64m;

    # Internal services call the backend over the private application network.
    # These locations also cover the bare prefix and normalised URI variants.
    location = /internal {
        return 403;
    }

    location ^~ /internal/ {
        return 403;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
