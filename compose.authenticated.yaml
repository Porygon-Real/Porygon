# Enrolled credentials only: invoke alongside compose.yaml and a private worker env file.
services:
  backend:
    environment:
      PORYGON_ACCESS_MODE: authenticated
  collector:
    environment:
      PORYGON_INTERNAL_API_TOKEN: ${COLLECTOR_API_TOKEN:?Enroll the collector credential first}
  telemetry:
    environment:
      PORYGON_INTERNAL_API_TOKEN: ${TELEMETRY_API_TOKEN:?Enroll the telemetry credential first}
  responder:
    environment:
      PORYGON_ACCESS_MODE: authenticated
      PORYGON_INTERNAL_API_TOKEN: ${RESPONDER_API_TOKEN:?Enroll the responder credential first}
  scanner:
    environment:
      PORYGON_INTERNAL_API_TOKEN: ${SCANNER_API_TOKEN:?Enroll the scanner credential first}
